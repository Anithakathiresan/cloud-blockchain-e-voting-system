<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#DFF0D8" />
    <meta name="description" content="Academic EVM voting demonstration. Ballots are recorded on a public blockchain and are not anonymous." />
    <title>College E-Voting System</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint; light is the default.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('evoting_theme') === 'dark' ? 'dark' : 'light'
      } catch (err) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dapp/main.tsx"></script>
  </body>
</html>
